server {

    listen 80;
    listen [::]:80;

	access_log /var/log/nginx/default-access.log;
	error_log  /var/log/nginx/default-error.log;

    # Tory API Routing Rule
    location ~* /tory/api/(\d+\.\d+\.\d+\.\d+)/(.*) {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header HOST $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass https://$1/$2$is_args$args;
        proxy_redirect off;
    }
    location ~* /tory/api/(\w+\.kmtltd\.net\.au)/(.*) {
        resolver 10.240.12.223 10.250.14.2 10.248.6.2 10.248.2.2 10.244.20.2;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header HOST $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass https://$1/$2$is_args$args;
        proxy_redirect off;
    }
    # requested by Filo to add torys to svt. https://kmartonline.atlassian.net/browse/DOS2-518


    # curl -k "https://ihmpe1q80k-vpce-0427ca967ae48c393.execute-api.ap-southeast-2.amazonaws.com/dev/Tory-001/v1/getStatus"

    location ~* /tory/api/([0-9a-zA-Z]+)-vpce-([0-9a-zA-Z]+)\.execute-api.ap-southeast-2.amazonaws.com/([a-z]+)/([a-zA-Z]+)-([0-9]+)/([0-9a-z]+)/([0-9a-zA-Z]+) {
        resolver 10.253.0.212 10.253.0.55;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass https://$1-vpce-$2.execute-api.ap-southeast-2.amazonaws.com/$3/$4-$5/$6/$7$is_args$args;
        proxy_redirect off;
    }
    # Store API Routing Rule
    location ~* /store/api/(\w+\.core\.kmtltd\.net\.au\:33380)/(.*) {
        resolver 10.240.12.223 10.250.14.2 10.248.6.2 10.248.2.2 10.244.20.2;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header HOST $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass https://$1/$2$is_args$args;
        proxy_redirect off;
    }

    # Store API Routing Rule for 33383 port. Only used to send printing jobs
    location ~* /store/api/(\w+\.core\.kmtltd\.net\.au\:33383)/(.*) {
        resolver 10.240.12.223 10.250.14.2 10.248.6.2 10.248.2.2 10.244.20.2;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header HOST $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass https://$1/$2$is_args$args;
        proxy_redirect off;
    }

    # Stock On Hand Rule
    location ~* /soh/api/(\d+\.\d+\.\d+\.\d+\:33380)/(.*) {
        proxy_set_header x-real-ip $remote_addr;
        proxy_set_header x-forwarded-for $proxy_add_x_forwarded_for;
        proxy_set_header host $http_host;
        proxy_set_header x-nginx-proxy true;
        proxy_pass https://$1/$2$is_args$args;
        proxy_redirect off;
    }
    location ~* /soh/api/(\w+\.core\.kmtltd\.net\.au\:33380)/(.*) {
        resolver 10.232.139.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header HOST $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass https://$1/$2$is_args$args;
        proxy_redirect off;
    }


    # Integration Server Routing
    location /integration/service/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header HOST $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_pass http://integration-slave:8080/;
        proxy_redirect off;
    }


    # Default API 
	location / {
        return 200 'Debug: OK';
        add_header Content-Type text/plain;
		#proxy_set_header X-Real-IP $remote_addr;
		#proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		#proxy_set_header HOST $http_host;
		#proxy_set_header X-Nginx-Proxy true;
		#proxy_pass http://localhost:8081;
		#proxy_redirect off;
	}
}

