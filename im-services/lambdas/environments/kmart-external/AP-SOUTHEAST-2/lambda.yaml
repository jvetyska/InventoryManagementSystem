AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Lamda Functions for DOSA
Parameters:
  ParametersStackName:
    Type: String
  ClientName:
    Type: String
    AllowedPattern: .+
  Environment:
    Type: String
  WmsPrivateUrl:
    Type: String
  KmartRfidSohS3Bucket:
    Type: String
  SophiaUploadS3Bucket:
    Type: String
  RfidDbServer:
    Type: String
  LogLevel:
    Type: String
    AllowedValues:
      - error
      - warn
      - info
      - debug
      - silly
  TwistLockInstallBundleSecret:
    Type: String

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 180
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: !Sub '${ClientName}-hamilton-${Environment}'
        LOG_LEVEL: !Sub '${LogLevel}'
        LOG_NAMESPACES: '*'
        TW_POLICY: !Sub '{{resolve:secretsmanager:${TwistLockInstallBundleSecret}:SecretString:TW_POLICY}}'
    VpcConfig:
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ParametersStackName}-private-subnet-ids'
      SecurityGroupIds:
        - !Ref LambdaSecurityGroup

Resources:
  # This is For Lambda Layers
  GetConfigLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: lambda-dependencies
      Description: Layer Dependencies for Node Environment lambda
      ContentUri: ../../../LayerDependencies/
      CompatibleRuntimes:
        - nodejs12.x
      LicenseInfo: 'MIT'
      RetentionPolicy: Retain

  PrismaTwistlockLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: prisma-twistlock
      Description: Integrates Prisma Twistlock vulnerability detection into lambdas.
      ContentUri: ../../../layers/prisma-twistlock/
      CompatibleRuntimes:
        - nodejs12.x
      LicenseInfo: 'MIT'
      RetentionPolicy: Retain

  #Security Group for the Lambdas in Private VPC
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ParametersStackName}-vpc-id'
      GroupName: !Sub '${Environment}-${AWS::Region}-dosa-lambda-securitygroup'
      GroupDescription: Security Group for the Lambda
      SecurityGroupEgress:
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 443 # HTTPS
          ToPort: 443
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 3306 # MySQL connections
          ToPort: 3306
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 9092 # Kafka connections
          ToPort: 9092
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 1433
          ToPort: 1433
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 8084 # Prisma Twistlock phones home on this port
          ToPort: 8084
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-${AWS::Region}-dosa-lambda-securitygroup'

  # SG Ingress Rule for RDS to allow lambda to connect
  RDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: TCP
      FromPort: 3306
      ToPort: 3306
      GroupId:
        Fn::ImportValue: !Sub 'dosa-${Environment}-rds-sg-id'
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub 'Allow Lambdas access to ${Environment} RDS.'

  # SNS Topic with subscription for backfill efficacy metric report.
  BackfillEfficacyMetricReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ClientName}-${Environment}-backfill-efficacy-report-metric'

  StoreBackfillScheduleCsvTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ClientName}-${Environment}-store-backfill-schedule-csv'

  BackfillEfficacyMetricReportEngineering:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: engineering@anko.com
      Protocol: email
      TopicArn: !Ref BackfillEfficacyMetricReportTopic

  BackfillEfficacyMetricReportBiReport:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: bi.reports@anko.com
      Protocol: email
      TopicArn: !Ref BackfillEfficacyMetricReportTopic

  StoreBackfillScheduleCsvEngineering:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: engineering@anko.com
      Protocol: email
      TopicArn: !Ref StoreBackfillScheduleCsvTopic

  StoreBackfillScheduleCsvBiReport:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: bi.reports@anko.com
      Protocol: email
      TopicArn: !Ref StoreBackfillScheduleCsvTopic

  # Basic cloudwatch log and Secret Manager access policy
  BasicCloudWatchLogAndSecretManagerAccessPolicy:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
      - PerformanceReportingIAMRole
      - CombineDailyLogIAMRole
      - SESIAMRole
      - ProcessToryWebhookDataSQSLambdaIAMRole
      - InventoryFileUploadForKmartIAMRole
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              - 'secretsmanager:GetSecretValue'
              - 'xray:PutTraceSegments'
              - 'xray:PutTelemetryRecords'
            Resource: '*'
      PolicyName: !Sub '${ClientName}-${Environment}-CloudWatchLogAndGetSecret'
      Roles:
        - !Ref BasicExecutionAndSecretsIAMRole
        - !Ref PerformanceReportingIAMRole
        - !Ref CombineDailyLogIAMRole
        - !Ref SESIAMRole
        - !Ref ProcessToryWebhookDataSQSLambdaIAMRole
        - !Ref InventoryFileUploadForKmartIAMRole

  # Basic lambda execution role and inline policy for cloud watch log and secret access
  BasicExecutionAndSecretsIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Shared role for Basic Lambda execution and Secret Manager access
      RoleName: !Sub '${ClientName}-${Environment}-BasicExecutionAndSecretsRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations'
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'

  # WMS API Call Lambda Function
  WmsApiCall:
    Type: AWS::Serverless::Function
    Properties:
      Description: Used to call API endpoints on our WMS application from other CloudWatch rules
      CodeUri: ../../../shared/src/wms-api-call/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: wms-api-call.handler
      Events:
        InventoryCheckCloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-create_random_inventory_checks_every_hour'
            Input: !Sub '{"api" : "https://${WmsPrivateUrl}/api/create_random_inventory_checks", "request": "POST"}'
            Schedule: cron(5 * * * ? *)
            Enabled: true
        InventoryBackupCloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-create_inventory_backup'
            Input: !Sub '{"api" : "https://${WmsPrivateUrl}/api/log/record_inventory_history", "request": "POST"}'
            Schedule: cron(0 * * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      FunctionName: !Sub '${ClientName}-${Environment}-wms-api-call'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Performance Report Creation Lambda function
  PerformanceReportCreation:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-performance-report-creation'
      Description: Function to create performance report
      CodeUri: ../../../shared/src/performance-report-creation/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: performance-report-creation.handler
          DYNAMO_TABLE:
            Fn::ImportValue: !Sub 'dosa-${Environment}-dynamodb-performance-log-table'
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-performance-report-creation'
            Schedule: rate(1 hour)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt PerformanceReportingIAMRole.Arn

  # Performance Reporting lambda IAM Role
  PerformanceReportingIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-AllowS3BucketAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::${ClientName}-dosa-${Environment}-logging/*'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations'
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
      Description: Role for performance reporting lambda
      RoleName: !Sub '${ClientName}-${Environment}-PerformanceReporting'

  # Inventory Bot Schedule Check Lambda Function
  InventoryBotScheduleCheck:
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks inventory_bot_schedule and updates bot_process
      CodeUri: ../../../shared/src/inventory-bot-schedule-check/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: inventory-bot-schedule-check.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-inventory-bot-schedule-check'
            Schedule: cron(0/15 * * * ? *)
            Enabled: true
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${Environment}-inventory-bot-schedule-check'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Inventory Bot Running Check Lambda Function
  InventoryBotRunningCheck:
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks inventory_bot whichs have Running bot_process
      CodeUri: ../../../shared/src/inventory-bot-running-check/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: inventory-bot-running-check.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-inventory-bot-running-check'
            Schedule: cron(5,20,35,50 * * * ? *)
            Enabled: true
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${Environment}-inventory-bot-running-check'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  InventoryBotChargingCheck:
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks if inventory bot is charging
      CodeUri: ../../../shared/src/inventory-bot-charging-check/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: inventory-bot-charging-check.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-inventory-bot-charging-check'
            Schedule: cron(15,45 * * * ? *)
            Enabled: true
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${Environment}-inventory-bot-charging-check'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Database cleanup
  DatabaseCleanup:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-database-cleanup'
      Description: Cleans up tables in MySQL and DynamoDB that contain old logging information no longer needed
      CodeUri: ../../../shared/src/database-cleanup/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: database-cleanup.handler
          DYNAMO_TABLE_1:
            Fn::ImportValue: !Sub 'dosa-${Environment}-dynamodb-task-log-table'
          DYNAMO_TABLE_2:
            Fn::ImportValue: !Sub 'dosa-${Environment}-dynamodb-inventory-log-table'
          DYNAMO_TABLE_3:
            Fn::ImportValue: !Sub 'dosa-${Environment}-dynamodb-performance-log-table'
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-daily-database-cleanup'
            Description: Runs once every day at 1am Australia Melbourne time
            Schedule: cron(0 15 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt DatabaseCleanupLambdaIAMRole.Arn

    # IAM role associated with Database Cleanup
  DatabaseCleanupLambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Effect: Allow
                Resource: '*'
          PolicyName: !Sub '${ClientName}-${Environment}-DatabaseCleanup'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations'
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
      Description: Role for Database Cleanup Lambda
      RoleName: !Sub '${ClientName}-${Environment}-DatabaseCleanupLambdaIAMRole'

  RestApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${ClientName}-${Environment}-apis'
      StageName: !Sub ${Environment}
      EndpointConfiguration:
        Type: PRIVATE
        VPCEndpointIds:
          - Fn::ImportValue: !Sub '${ParametersStackName}-api-gateway-endpoint-id'
      Auth:
        ResourcePolicy:
          CustomStatements:
            [
              {
                'Effect': 'Allow',
                'Principal': '*',
                'Action': 'execute-api:Invoke',
                'Resource': !Sub 'arn:aws:execute-api:ap-southeast-2:${AWS::AccountId}:*/*',
                'Condition':
                  {
                    'StringEquals':
                      {
                        'aws:SourceVpc':
                          {
                            'Fn::ImportValue': !Sub '${ParametersStackName}-vpc-id',
                          },
                      },
                  },
              },
            ]

  ApiGatewayLambdaTest:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Testing api gateway inside the VPC
      CodeUri: ../src/api-gateway-lambda-test/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: api-gateway-lambda-test.handler
      Events:
        ApiGateWayTest:
          Type: Api
          Properties:
            Path: /test-route
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${Environment}-api-gateway-test-lambda'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Inventory Bot Running Check Lambda Function
  InventoryBotReportError:
    DependsOn:
      - SESIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Sends notifications for inventory bot error
      CodeUri: ../../../shared/src/inventory-bot-report-error/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: inventory-bot-report-error.handler
      Events:
        InventoryBotReportError:
          Type: Api
          Properties:
            Path: /inventory-bot-report-error
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${Environment}-inventory-bot-report-error'
      Role: !GetAtt SESIAMRole.Arn

  SESIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Role for SES Email sending
      RoleName: !Sub '${ClientName}-${Environment}-SESIAMRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSESFullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'

  # Combine daily logs Lambda function
  CombineDailyLog:
    DependsOn:
      - CombineDailyLogIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Called by a CloudWatch rule "hourly_combine_daily_logs" that combines fragmented Firehose logs into one single S3 file that's much easier to parse (once per day)
      CodeUri: ../../../shared/src/combine-daily-logs/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-hourly-combine-daily-logs'
            Description: Runs five minutes after the hour. This combines all logs for the current day and puts them into the S3 bucket "NODE_ENV-whm-logging/NODE_ENV-full"
            Schedule: cron(5 * * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      FunctionName: !Sub '${ClientName}-${Environment}-combine-daily-log'
      Role: !GetAtt CombineDailyLogIAMRole.Arn

  # Combine daily logs Lambda IAM Role
  CombineDailyLogIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-AllowS3BucketAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::${ClientName}-dosa-${Environment}-logging/*'
      Description: Role for Combine Daily Log lambda
      RoleName: !Sub '${ClientName}-${Environment}-CombineDailyLog'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'

  # Generate Backfill Replenishment Tasks
  GenerateBackfillReplenishmentTasks:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-generate-backfill-replenishment-task'
      Description: Generates backfill replenishment tasks
      CodeUri: ../../../shared/src/generate-backfill-replenishment-tasks/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: generate-backfill-replenishment-tasks.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-generate-backfill-replenishment-tasks'
            Description: Runs on minutes 1, 16, 31, and 46 of every hour
            Schedule: cron(1,16,31,46 * * * ? *)
            Enabled: false
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Create backfill count tasks
  CreateBackfillCountTasks:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-create-backfill-count-task'
      Description: Generates backfill count tasks
      CodeUri: ../../../shared/src/create-backfill-count-tasks/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: create-backfill-count-tasks.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-create-backfill-count-tasks'
            Description: Runs on minutes 1, 16, 31, and 46 of every hour
            Schedule: cron(1,16,31,46 * * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Synchronization of product data from Kmart's database to Anko's database
  ProductSyncData:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-product-sync-data'
      Description: Product synchronization from Kmart's internal MS SQL database to Anko's MySQL database
      CodeUri: ../src/product-sync-data/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: product-sync-data.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-product-sync-data'
            Description: Runs once every day at midnight, Sydney, Australia time
            Schedule: cron(0 14 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Synchronization of image data from Kmart's database to Anko's database
  ImageSyncData:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-image-sync-data'
      Description: Image synchronization from Kmart's internal MS SQL database to Anko's MySQL database
      CodeUri: ../src/image-sync-data/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: image-sync-data.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-image-sync-data'
            Description: Runs once every day 20 minutes after midnight, Sydney, Australia time
            Schedule: cron(20 14 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Scans Anko's database and determines which images to retrieve from Kmart, uploading those to Anko's S3 Bucket
  ImageSyncS3:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-image-sync-s3'
      Description: Image synchronization from Kmart's internal MS SQL database to Anko's MySQL database
      CodeUri: ../src/image-sync-s3/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: image-sync-s3.handler
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${Environment}-image-sync-s3'
            Description: Runs once every day 40 minutes after midnight, Sydney, Australia time
            Schedule: cron(40 14 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # System Inventory Checks
  SystemInventoryChecks:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-system-inventory-checks'
      Description: Create system inventory check tasks
      CodeUri: ../src/system-inventory-checks/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Environment:
        Variables:
          HANDLER: system-inventory-checks.handler
      Events:
        SystemInventoryChecks:
          Type: Api
          Properties:
            Path: /system-inventory-checks
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Kmart Inventory Snapshot
  KmartInventorySnapshot:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${Environment}-kmart-inventory-snapshot'
      Description: Create Kmart Inventory Snapshot at the start of backfill schedules
      CodeUri: ../src/kmart-inventory-snapshot/
      Handler: dosa.handler
      Runtime: nodejs12.x
