            RestApiId:
              Ref: RestApiGateway
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt GenericSlackReportingRole.Arn
      FunctionName: !Sub '${ClientName}-${Environment}-generic-slack-reporting'
  # =============================== Generic Slack Reporting Infra (End) ===============================
  # =============================== Product & Image Sync Infra (Start) ===============================
  # FetchProductsFromIPS IAM Role
  FetchProductsFromIPSIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-FetchProductsFromIPSIAMRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*" 
      Description: Role to fetch and push data onto SQS
      RoleName: !Sub '${ClientName}-${Environment}-FetchProductsFromIPSIAMRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
  # FetchProductsFromIPS Lamba Stack
  FetchProductsFromIPSLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - FetchProductsFromIPSIAMRole
    Properties:
      Description: Fetch Products from IPS DB
      CodeUri: ../../../shared/src/product-and-image-sync/fetch-products-ips-db/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Timeout: 900
      MemorySize: 4096
      ReservedConcurrentExecutions: 5
      FunctionName: !Sub '${ClientName}-${Environment}-fetch-product-from-ips'
      Role: !GetAtt FetchProductsFromIPSIAMRole.Arn
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name:  !Sub '${ClientName}-${Environment}-daily-product-sync-init'
            Schedule: cron(0 14 * * ? *)
            Enabled: false
  # SQS
  PersitProductsToDBQueue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 5
      QueueName: !Sub '${ClientName}-${Environment}-persist-product-to-db-queue'
      ReceiveMessageWaitTimeSeconds: 1
      VisibilityTimeout: 900
      MessageRetentionPeriod: 7200
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt 'ProductSyncDeadLetterQueue.Arn'
        maxReceiveCount: 3
  # Role for Lambda
  PersistProductsToDBLambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-PersistProductsToDBLambdaIAMRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*"
      Description: Role for lambda PersistProductsToDBLambda which saves products into the db
      RoleName: !Sub '${ClientName}-${Environment}-PersistProductsToDBLambdaIAMRole' 
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
  # Lambda
  PersistProductsToDBLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - PersistProductsToDBLambdaIAMRole
    Properties:
      Description: Process Products Data that are being put on the SQS
      CodeUri: ../../../shared/src/product-and-image-sync/persist-products-to-db/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Timeout: 900
      MemorySize: 1024
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      ReservedConcurrentExecutions: 5
      FunctionName: !Sub '${ClientName}-${Environment}-persist-product-to-db'
      Role: !GetAtt PersistProductsToDBLambdaIAMRole.Arn
  # Lambada SQS Mapping
  PersistProductsToDBSQSEvent:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn:
        Fn::GetAtt:
          - PersitProductsToDBQueue
          - Arn  
      FunctionName:
        Ref: PersistProductsToDBLambda
  #FetchAndCompareImagesPIMSQueue
  FetchAndCompareImagesPIMSQueue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 5
      QueueName: !Sub '${ClientName}-${Environment}-fetch-and-compare-images-pims-queue'
      ReceiveMessageWaitTimeSeconds: 1
      VisibilityTimeout: 900
      MessageRetentionPeriod: 7200
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt 'ProductSyncDeadLetterQueue.Arn'
        maxReceiveCount: 3
  #FetchAndCompareImagesPIMSIAMRole
  FetchAndCompareImagesPIMSIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-FetchAndCompareImagesPIMSIAMRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*"
      Description: Role to process keycode from queue and fetch images from PIMS DB
      RoleName: !Sub '${ClientName}-${Environment}-FetchAndCompareImagesPIMSIAMRole' 
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary' 
  #FetchAndCompareImagesPIMSLambda
  FetchAndCompareImagesPIMSLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - FetchAndCompareImagesPIMSIAMRole
    Properties:
      Description: Get Keycodes from Queue, fetch the ImageHash from PIM_DB and check if image changed, then push to next queue
      CodeUri: ../../../shared/src/product-and-image-sync/fetch-and-compare-images-pims/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Timeout: 900
      MemorySize: 1024
      ReservedConcurrentExecutions: 5
      FunctionName: !Sub '${ClientName}-${Environment}-fetch-and-compare-images-pims'
      Role: !GetAtt FetchAndCompareImagesPIMSIAMRole.Arn
  #FetchAndCompareImagesPIMSSQSEvent
  FetchAndCompareImagesPIMSSQSEvent:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn:
        Fn::GetAtt:
          - FetchAndCompareImagesPIMSQueue
          - Arn  
      FunctionName:
        Ref: FetchAndCompareImagesPIMSLambda
  #UploadImagesToS3Queue
  UploadImagesToS3Queue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 5
      QueueName: !Sub '${ClientName}-${Environment}-upload-images-to-s3-queue'
      ReceiveMessageWaitTimeSeconds: 1
      VisibilityTimeout: 905
      MessageRetentionPeriod: 7200
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt 'ProductSyncDeadLetterQueue.Arn'
        maxReceiveCount: 3
  #UploadImagesToS3IAMRole
  UploadImagesToS3IAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-UploadImagesToS3IAMRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*"
      Description: Role to upload product images to our s3 bucket
      RoleName:  !Sub '${ClientName}-${Environment}-UploadImagesToS3IAMRole' 
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
  #UploadImagesToS3Lambda
  UploadImagesToS3Lambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - UploadImagesToS3IAMRole
    Properties:
      Description: Process Products Data that are being put on the SQS
      CodeUri: ../../../shared/src/product-and-image-sync/upload-images-to-s3/
      Handler: dosa.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
        - !Ref PrismaTwistlockLayer
      Timeout: 900
      MemorySize: 2048
      ReservedConcurrentExecutions: 20
      FunctionName:  !Sub '${ClientName}-${Environment}-upload-images-to-s3'
      Role: !GetAtt UploadImagesToS3IAMRole.Arn 
  #UploadImagesToS3LambdaSQSEvent
  UploadImagesToS3LambdaSQSEvent:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn:
        Fn::GetAtt:
          - UploadImagesToS3Queue
          - Arn  
      FunctionName:
        Ref: UploadImagesToS3Lambda
  ProductSyncDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ClientName}-${Environment}-product-sync-dead-letter-queue' 
  # =============================== Product & Image Sync Infra (end) =============================== 

Outputs:
  TaskManagementSystemLambdaIAMRoleArn:
    Description: Lambda Role Arn for the step functions
    Value: !GetAtt TaskManagementSystemLambdaIAMRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-step-function-lambda-role-arn'
  InventoryFileUploadForKmartIAMRoleArn:
    Description: Lambda Role Arn Upload Inventory
    Value: !GetAtt InventoryFileUploadForKmartIAMRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-inventory-file-upload-for-kmart-arn'
  DataUploadForSophiaIAMRoleArn:
    Description: Lambda Role Arn for the Sophia Upload
    Value: !GetAtt DataUploadForSophiaIAMRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-rfid-data-for-sophia-arn'
