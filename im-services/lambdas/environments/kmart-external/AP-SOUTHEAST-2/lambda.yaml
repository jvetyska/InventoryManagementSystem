      Role: !GetAtt TaskManagementSystemLambdaIAMRole.Arn

  TaskManagementSystemLambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-TaskManagementSystemStateMachineRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'states:StartExecution'
                  - 'states:SendTaskSuccess'
                  - 'states:SendTaskFailure'
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: '*'
        - PolicyName: !Sub '${ClientName}-${Environment}-IPSFileUploadAllowS3BucketAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:PutObjectAcl'
                Resource:
                  - !Sub 'arn:aws:s3:::${KmartRfidSohS3Bucket}/*'
                  - !Sub 'arn:aws:s3:::${ClientName}-dosa-${Environment}-logging/*'
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource:
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ClientName}-${Environment}-store-backfill-schedule-csv'
      Description: Role for All Task Management State Machine Lambda
      RoleName: !Sub '${ClientName}-${Environment}-TaskManagementSystemLambdaIAMRole'

  TaskManagementSystemExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - !Sub states.${AWS::Region}.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: '/'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
      PermissionsBoundary:
        Fn::ImportValue: !Sub '${ParametersStackName}-iam-role-boundary'
      Policies:
        - PolicyName: !Sub '${ClientName}-${Environment}-TaskManagementSystemExecutionRolePolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: '*'
      Description: Role for Task Management System Step Function Execution
      RoleName: !Sub '${ClientName}-${Environment}-TaskManagementSystemExecutionRole'

  # TaskManagementSystemStepFunction
  TaskManagementSystemStepFunction:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ClientName}-${Environment}-TaskManagementSystemStepFunction'
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub
        - |-
          {
            "StartAt": "GetStartRunKmartInventorySnapshot",
            "States": {
              "GetStartRunKmartInventorySnapshot": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${KmartInventorySnapshotSQSURL}",
                  "MessageBody": {
                    "TaskToken.$": "$$.Task.Token",
                    "Input.$": "$",
                    "Type": "ScheduleStart"
                  }
                },
                "HeartbeatSeconds": 1800,
                "Next": "StoreStartingTaskToken",
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "Next": "StoreStartingTaskToken",
                    "ResultPath": "$.error"
                  }
                ]
              },
              "StoreStartingTaskToken": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "${StoreTaskTokenName}",
                  "Payload": {
                    "TaskToken.$": "$$.Task.Token",
                    "status": "WaitingForStocktakes",
                    "executionID.$": "$$.Execution.Id",
                    "Input.$": "$"
                  }
                },
                "HeartbeatSeconds": 36000,
                "Next": "GetEndRunKmartInventorySnapshot"
              },
              "GetEndRunKmartInventorySnapshot": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${KmartInventorySnapshotSQSURL}",
                  "MessageBody": {
                    "Input.$": "$",
                    "TaskToken.$": "$$.Task.Token",
                    "Type": "ScheduleEnd"
                  }
                },
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "Next": "GenerateStoreInventorySnapshot",
                    "ResultPath": "$.error"
                  }
                ],
                "HeartbeatSeconds": 1800,
                "Next": "GenerateStoreInventorySnapshot"
              },
              "GenerateStoreInventorySnapshot": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${InventorySnapshotAndBackfillSQSURL}",
                  "MessageBody": {
                    "TaskToken.$": "$$.Task.Token",
                    "Input.$": "$"
                  }
                },
                "HeartbeatSeconds": 1200,
                "Next": "GenerateBackfillTasks"
              },
              "GenerateBackfillTasks": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${GenerateBackfillTasksName}",
                  "Payload": {
                    "Input.$": "$"
                  }
                },
                "Next": "choiceGenerateRFIDExceptionTasks",
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.ALL"
                    ],
                    "Next": "choiceGenerateRFIDExceptionTasks",
                    "ResultPath": "$.error"
                  }
                ]
              },
              "choiceGenerateRFIDExceptionTasks": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Payload.rfidExceptionType",
                    "StringEquals": "system",
                    "Next": "GenerateSystemRFIDExceptionTasks"
                  },
                  {
                    "Variable": "$.Payload.rfidExceptionType",
                    "StringEquals": "standard",
                    "Next": "GenerateStandardRFIDExceptionTasks"
                  }
                ],
                "Default": "EndState"
              },
              "GenerateStandardRFIDExceptionTasks": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${GenerateRFIDExceptionTasksName}",
                  "Payload": {
                    "Input.$": "$.Payload",
                    "Type": "standard"
                  }
                },
                "Next": "EndState"
              },
              "GenerateSystemRFIDExceptionTasks": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${GenerateRFIDExceptionTasksName}",
                  "Payload": {
                    "Input.$": "$.Payload",
                    "Type": "system"
                  }
                },
                "Next": "SendInitialIPSInventoryUpdateFile"
              },
              "SendInitialIPSInventoryUpdateFile": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${IPSFileUploadQueueSQSURL}",
                  "MessageBody": {
                    "Input.$": "$.Payload",
                    "TaskToken.$": "$$.Task.Token",
                    "Type": "StocktakesFinished"
                  }
                },
                "HeartbeatSeconds": 1800,
                "Next": "StoreWaitingForRFIDExceptionsTaskToken"
              },
              "StoreWaitingForRFIDExceptionsTaskToken": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "${StoreTaskTokenName}",
                  "Payload": {
                    "Input.$": "$",
                    "TaskToken.$": "$$.Task.Token",
                    "status": "WaitingForRFIDExceptionTasks",
                    "executionID.$": "$$.Execution.Id"
                  }
                },
                "HeartbeatSeconds": 36000,
                "Next": "SendFinalIPSInventoryUpdateFile"
              },
              "SendFinalIPSInventoryUpdateFile": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
