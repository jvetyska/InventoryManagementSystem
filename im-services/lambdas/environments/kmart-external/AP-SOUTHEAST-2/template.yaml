          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*"
      Description: Role for Task Management System Step Function Execution
      RoleName: !Sub '${ClientName}-${EnvironmentType}-ProcessToryDataSystemExecutionRole'
      
  # ProcessToryDataSystemStepFunction
  ProcessToryDataSystemStepFunction:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ClientName}-${EnvironmentType}-ProcessToryDataSystemStepFunction'
      TracingConfiguration:
        Enabled: true
      DefinitionString:
        !Sub
          - |-
            {
              "Comment": "Tort-data-processing",
              "StartAt": "choiceByStatus",
              "States": {
                "choiceByStatus": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.status",
                      "StringEquals": "RunDataReady",
                      "Next": "GetToryDataAndPreprocess"
                    },
                    {
                      "Variable": "$.status",
                      "StringEquals": "Interrupted",
                      "Next": "ErrorReporting"
                    }
                  ],
                  "Default": "EndState"
                },
                "GetToryDataAndPreprocess": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
                  "Parameters": {
                    "QueueUrl": "${PreprocessingToryDataSQSURL}",
                    "MessageBody": {
                      "TaskToken.$": "$$.Task.Token",
                      "Input.$": "$"
                    }
                  },
                  "ResultPath": "$",
                  "HeartbeatSeconds": 10800,
                  "Next": "ChoiceForUpdateInventory",
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.ALL"
                      ],
                      "Next": "ErrorReporting",
                      "ResultPath": "$.error"
                    }
                  ]
                },
                "ChoiceForUpdateInventory": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.isUpdateInventory",
                      "BooleanEquals": true,
                      "Next": "UpdateInventoryWithToryData"
                    },
                    {
                      "Variable": "$.isUpdateInventory",
                      "BooleanEquals": false,
                      "Next": "WaitBeforeMapUpload"
                    }
                  ],
                  "Default": "EndState"
                },
                "UpdateInventoryWithToryData": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::sqs:sendMessage.waitForTaskToken",
                  "Parameters": {
                    "QueueUrl": "${UpdatingInventoryDataSQSURL}",
                    "MessageBody": {
                      "TaskToken.$": "$$.Task.Token",
                      "Input.$": "$"
                    }
                  },
                  "ResultPath": "$",
                  "HeartbeatSeconds": 10800,
                  "Next": "KafkaUpload",
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.ALL"
                      ],
                      "Next": "ErrorReporting",
                      "ResultPath": "$.error"
                    }
                  ]
                },
                "KafkaUpload": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::lambda:invoke",
                  "Parameters": {
                    "FunctionName": "${KafkaUploadLambda}",
                    "Payload": {
                      "Input.$": "$"
                    }
                  },
                  "ResultPath": "$.Payload",
                  "Next": "WaitBeforeMapUpload",
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.ALL"
                      ],
                      "Next": "ErrorReporting",
                      "ResultPath": "$.error"
                    }
                  ]
                },
                "WaitBeforeMapUpload": {
                  "Type": "Wait",
                  "Seconds": 180,
                  "Next": "UploadToryMap"
                },
                "UploadToryMap": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::lambda:invoke",
                  "Parameters": {
                    "FunctionName": "${UploadToryMapLambda}",
                    "Payload": {
                      "Input.$": "$"
                    }
                  },
                  "ResultPath": "$.Payload",
                  "Next": "EndState",
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.ALL"
                      ],
                      "Next": "ErrorReportingForMap",
                      "ResultPath": "$.error"
                    }
                  ]
                },
                "ErrorReporting": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::lambda:invoke",
                  "Parameters": {
                    "FunctionName": "${ErrorReportingLambda}",
                    "Payload": {
                      "Input.$": "$"
                    }
                  },
                  "ResultPath": "$.Payload",
                  "Next": "WaitBeforeMapUpload",
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.ALL"
                      ],
                      "Next": "WaitBeforeMapUpload",
                      "ResultPath": "$.error"
                    }
                  ]
                },
                "ErrorReportingForMap": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::lambda:invoke",
                  "Parameters": {
                    "FunctionName": "${ErrorReportingLambda}",
                    "Payload": {
                      "Input.$": "$"
                    }
                  },
                  "ResultPath": "$",
                  "Next": "EndState",
                  "Catch": [
                    {
                      "ErrorEquals": [
                        "States.ALL"
                      ],
                      "Next": "FailState",
                      "ResultPath": "$.error"
                    }
                  ]
                },
                "EndState": {
                  "Type": "Pass",
                  "End": true
                },
                "FailState": {
                  "Type": "Fail",
                  "Error": "See the start of FailState"
                }
              }
            }
          - {
              PreprocessingToryDataSQSURL: !Ref PreprocessingToryDataQueue,
              UpdatingInventoryDataSQSURL: !Ref UpdatingInventoryDataQueue,
              KafkaUploadLambda: !Ref KafkaUploadLambda,
              UploadToryMapLambda: !Ref UploadToryMapLambda,
              ErrorReportingLambda: !Ref ErrorReportingLambda
            }
      RoleArn: !GetAtt [ ProcessToryDataSystemExecutionRole, Arn ]
