AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  KMART AP-SOUTHEAST-2 Region Lambda


Parameters:
  BaseStack:
    Type: String
  ClientName:
    Type: String
    AllowedPattern: .+
  EnvironmentType:
    Type: String
    AllowedValues:
      - dev
      - uat
      - prod
  KmartRfidSohS3Bucket:
    Type: String
  SophiaUploadS3Bucket:
    Type: String
  WmsUrl:
    Type: String
  ApiGateWayVpceEndpoint:
    Type: String
  VpcEndpoint:
    Type: String
  LogLevel:
    Type: String
    AllowedValues:
      - error
      - warn
      - info
      - debug
      - silly

Conditions:
  CreateDevResources: !Equals
    - !Ref EnvironmentType
    - dev
  CreateUatResources: !Equals
    - !Ref EnvironmentType
    - uat
  CreateProdResources: !Equals
    - !Ref EnvironmentType
    - prod
  CreateOnlyForUatAndProd: !Or
    - !Equals [!Ref EnvironmentType, 'uat']
    - !Equals [!Ref EnvironmentType, 'prod']

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 180
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: !Sub '${ClientName}-${EnvironmentType}'
        LOG_LEVEL: !Sub '${LogLevel}'
        LOG_NAMESPACES: '*'
    VpcConfig:
      SubnetIds:
        - !ImportValue
          'Fn::Sub': '${BaseStack}-Private-Subnet-1'
        - !ImportValue
          'Fn::Sub': '${BaseStack}-Private-Subnet-2'
        - !ImportValue
          'Fn::Sub': '${BaseStack}-Private-Subnet-3'
      SecurityGroupIds:
        - !Ref LambdaVPC

Resources:
  # This is For Lambda Layers
  GetConfigLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: lambda-dependencies
      Description: Layer Dependencies for Node Environment lambda
      ContentUri: ../../../LayerDependencies/
      CompatibleRuntimes:
        - nodejs12.x
      LicenseInfo: 'MIT'
      RetentionPolicy: Retain

  # Service Group for lambda in private VPC
  LambdaVPC:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !ImportValue
        'Fn::Sub': '${BaseStack}-VPC'
      GroupDescription: Allows Lambda functions to live and operate in the private VPC
      GroupName: !Sub '${ClientName}-${EnvironmentType}-SGLambdaVPC'
      SecurityGroupIngress:
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 443
          ToPort: 443
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 3306
          ToPort: 3306
      SecurityGroupEgress:
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 443
          ToPort: 443
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 3306
          ToPort: 3306
        - IpProtocol: TCP
          CidrIp: 0.0.0.0/0
          FromPort: 9092
          ToPort: 9092

  # SNS Topic with subscription for backfill efficacy metric report.
  BackfillEfficacyMetricReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ClientName}-${EnvironmentType}-backfill-efficacy-report-metric'

  StoreBackfillScheduleCsvTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ClientName}-${EnvironmentType}-store-backfill-schedule-csv'

  BackfillEfficacyMetricReportEngineering:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: engineering@anko.com
      Protocol: email
      TopicArn: !Ref BackfillEfficacyMetricReportTopic

  BackfillEfficacyMetricReportBiReport:
    Condition: CreateOnlyForUatAndProd
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: bi.reports@anko.com
      Protocol: email
      TopicArn: !Ref BackfillEfficacyMetricReportTopic

  StoreBackfillScheduleCsvEngineering:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: engineering@anko.com
      Protocol: email
      TopicArn: !Ref StoreBackfillScheduleCsvTopic

  StoreBackfillScheduleCsvBiReport:
    Condition: CreateOnlyForUatAndProd
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: bi.reports@anko.com
      Protocol: email
      TopicArn: !Ref StoreBackfillScheduleCsvTopic

  # Dev Secret Manager
  SecretManagerDev:
    Type: AWS::SecretsManager::Secret
    Condition: CreateDevResources
    Properties:
      Description: ankous secret manager
      Name: !Sub '${ClientName}-${EnvironmentType}-secret'

  SecretManagerStg:
    Type: AWS::SecretsManager::Secret
    Condition: CreateUatResources
    Properties:
      Description: ankous secret manager
      Name: !Sub '${ClientName}-${EnvironmentType}-secret'

  SecretManagerProd:
    Type: AWS::SecretsManager::Secret
    Condition: CreateProdResources
    Properties:
      Description: ankous secret manager
      Name: !Sub '${ClientName}-${EnvironmentType}-secret'

  # Basic cloudwatch log and Secret Manager access policy
  BasicCloudWatchLogAndSecretManagerAccessPolicy:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
      - PerformanceReportingIAMRole
      - CombineDailyLogIAMRole
      - SESIAMRole
      - ProcessToryWebhookDataSQSLambdaIAMRole
      - InventoryFileUploadForKmartIAMRole
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              - 'secretsmanager:GetSecretValue'
              - 'xray:PutTraceSegments'
              - 'xray:PutTelemetryRecords'
            Resource: '*'
      PolicyName: !Sub '${ClientName}-${EnvironmentType}-CloudWatchLogAndGetSecret'
      Roles:
        - !Ref BasicExecutionAndSecretsIAMRole
        - !Ref PerformanceReportingIAMRole
        - !Ref CombineDailyLogIAMRole
        - !Ref SESIAMRole
        - !Ref ProcessToryWebhookDataSQSLambdaIAMRole
        - !Ref InventoryFileUploadForKmartIAMRole

  # Basic lambda execution role and inline policy for cloud watch log and secret access
  BasicExecutionAndSecretsIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Shared role for Basic Lambda execution and Secret Manager access
      RoleName: !Sub '${ClientName}-${EnvironmentType}-BasicExecutionAndSecretsRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations'
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'

  # Tory webhook triggers this lambda function
  TORYRunStatusWebhook:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Inventory Bot successful run webhook
      CodeUri: ../../../shared/src/tory-run-status-webhook/
      Handler: index.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        TORYRunStatusWebhook:
          Type: Api
          Properties:
            Path: /tory-run-status-webhook
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 60
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-tory-run-status-webhook'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # WMS API Call Lambda Function
  WmsApiCall:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      Description: Used to call API endpoints on our WMS application from other CloudWatch rules
      CodeUri: ../../../shared/src/wms-api-call/
      Handler: wms-api-call.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        InventoryCheckCloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-create_random_inventory_checks_every_hour'
            Input: !Sub '{"api" : "https://${WmsUrl}/api/create_random_inventory_checks", "request": "POST"}'
            Schedule: cron(5 * * * ? *)
            Enabled: true
        InventoryBackupCloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-create_inventory_backup'
            Input: !Sub '{"api" : "https://${WmsUrl}/api/log/record_inventory_history", "request": "POST"}'
            Schedule: cron(0 * * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-wms-api-call'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Performance Report Creation Lambda function
  PerformanceReportCreation:
    DependsOn:
      - PerformanceReportingIAMRole
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-performance-report-creation'
      Description: Function to create performance report
      CodeUri: ../../../shared/src/performance-report-creation/
      Handler: performance-report-creation.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Environment:
        Variables:
          DYNAMO_TABLE: !Sub '${ClientName}-${EnvironmentType}-performance-log'
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-performance-report-creation'
            Schedule: rate(1 hour)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt PerformanceReportingIAMRole.Arn

  # Performance Reporting lambda IAM Role
  PerformanceReportingIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub '${ClientName}-${EnvironmentType}-AllowS3BucketAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::${ClientName}-${EnvironmentType}-logging/*'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations'
      Description: Role for performance reporting lambda
      RoleName: !Sub '${ClientName}-${EnvironmentType}-PerformanceReporting'

  # Inventory Bot Schedule Check Lambda Function
  InventoryBotScheduleCheck:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks inventory_bot_schedule and updates bot_process
      CodeUri: ../../../shared/src/inventory-bot-schedule-check/
      Handler: inventory-bot-schedule-check.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-schedule-check'
            Schedule: cron(0/15 * * * ? *)
            Enabled: true
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-schedule-check'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Inventory Bot Running Check Lambda Function
  InventoryBotRunningCheck:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks inventory_bot whichs have Running bot_process
      CodeUri: ../../../shared/src/inventory-bot-running-check/
      Handler: inventory-bot-running-check.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-running-check'
            Schedule: cron(5,20,35,50 * * * ? *)
            Enabled: true
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-running-check'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  InventoryBotChargingCheck:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Checks if inventory bot is charging
      CodeUri: ../../../shared/src/inventory-bot-charging-check/
      Handler: inventory-bot-charging-check.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-charging-check'
            Schedule: cron(15,45 * * * ? *)
            Enabled: true
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-charging-check'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Database cleanup
  DatabaseCleanup:
    Type: AWS::Serverless::Function
    DependsOn:
      - DatabaseCleanupLambdaIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-database-cleanup'
      Description: Cleans up tables in MySQL and DynamoDB that contain old logging information no longer needed
      CodeUri: ../../../shared/src/database-cleanup/
      Handler: database-cleanup.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Environment:
        Variables:
          DYNAMO_TABLE_1: !Sub '${ClientName}-${EnvironmentType}-task-log'
          DYNAMO_TABLE_2: !Sub '${ClientName}-${EnvironmentType}-inventory-log'
          DYNAMO_TABLE_3: !Sub '${ClientName}-${EnvironmentType}-performance-log'
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-daily-database-cleanup'
            Description: Runs once every day at midnight UTC
            Schedule: cron(0 0 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt DatabaseCleanupLambdaIAMRole.Arn

    # IAM role associated with Database Cleanup
  DatabaseCleanupLambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Effect: Allow
                Resource: '*'
          PolicyName: !Sub '${ClientName}-${EnvironmentType}-DatabaseCleanup'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations'
      Description: Role for Database Cleanup Lambda
      RoleName: !Sub '${ClientName}-${EnvironmentType}-DatabaseCleanupLambdaIAMRole'

  RestApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${ClientName}-${EnvironmentType}-apis'
      StageName: prod
      EndpointConfiguration:
        Type: PRIVATE
        VPCEndpointIds:
          - !Sub '${ApiGateWayVpceEndpoint}'
      Auth:
        ResourcePolicy:
          CustomStatements:
            [
              {
                'Effect': 'Allow',
                'Principal': '*',
                'Action': 'execute-api:Invoke',
                'Resource': !Sub 'arn:aws:execute-api:ap-southeast-2:495621338632:*/*',
                'Condition':
                  {
                    'StringEquals': { 'aws:SourceVpc': !Sub '${VpcEndpoint}' },
                  },
              },
            ]

  ApiGatewayLambdaTest:
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Testing api gateway inside the VPC
      CodeUri: ../src/api-gateway-lambda-test/
      Handler: api-gateway-lambda-test.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        ApiGateWayTest:
          Type: Api
          Properties:
            Path: /test-route
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-api-gateway-test-lambda'
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Inventory Bot Running Check Lambda Function
  InventoryBotReportError:
    DependsOn:
      - SESIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Sends notifications for inventory bot error
      CodeUri: ../../../shared/src/inventory-bot-report-error/
      Handler: inventory-bot-report-error.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        InventoryBotReportError:
          Type: Api
          Properties:
            Path: /inventory-bot-report-error
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 300
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-inventory-bot-report-error'
      Role: !GetAtt SESIAMRole.Arn

  SESIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Role for SES Email sending
      RoleName: !Sub '${ClientName}-${EnvironmentType}-SESIAMRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSESFullAccess
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations

  # Combine daily logs Lambda function
  CombineDailyLog:
    DependsOn:
      - CombineDailyLogIAMRole
    Type: AWS::Serverless::Function
    Properties:
      Description: Called by a CloudWatch rule "hourly_combine_daily_logs" that combines fragmented Firehose logs into one single S3 file that's much easier to parse (once per day)
      CodeUri: ../../../shared/src/combine-daily-logs/
      Handler: index.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-hourly-combine-daily-logs'
            Description: Runs five minutes after the hour. This combines all logs for the current day and puts them into the S3 bucket "NODE_ENV-whm-logging/NODE_ENV-full"
            Schedule: cron(5 * * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-combine-daily-log'
      Role: !GetAtt CombineDailyLogIAMRole.Arn

  # Combine daily logs Lambda IAM Role
  CombineDailyLogIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub '${ClientName}-${EnvironmentType}-AllowS3BucketAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:*'
                Resource:
                  - !Sub 'arn:aws:s3:::${ClientName}-${EnvironmentType}-logging/*'
      Description: Role for Combine Daily Log lambda
      RoleName: !Sub '${ClientName}-${EnvironmentType}-CombineDailyLog'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonVPCCrossAccountNetworkInterfaceOperations

  # Generate Backfill Replenishment Tasks
  GenerateBackfillReplenishmentTasks:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-generate-backfill-replenishment-task'
      Description: Generates backfill replenishment tasks
      CodeUri: ../../../shared/src/generate-backfill-replenishment-tasks/
      Handler: generate-backfill-replenishment-tasks.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-generate-backfill-replenishment-tasks'
            Description: Runs every 5 minutes starting on the 1st min of every hour
            Schedule: cron(1/5 * * * ? *)
            Enabled: false
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Create backfill count tasks
  CreateBackfillCountTasks:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-create-backfill-count-task'
      Description: Generates backfill count tasks
      CodeUri: ../../../shared/src/create-backfill-count-tasks/
      Handler: create-backfill-count-tasks.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-create-backfill-count-tasks'
            Description: Runs every 5 minutes starting on the 1st min of every hour
            Schedule: cron(1/5 * * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Synchronization of product data from Kmart's database to Anko's database
  ProductSyncData:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-product-sync-data'
      Description: Product synchronization from Kmart's internal MS SQL database to Anko's MySQL database
      CodeUri: ../src/product-sync-data/
      Handler: product-sync-data.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-product-sync-data'
            Description: Runs once every day at midnight, Sydney, Australia time
            Schedule: cron(0 14 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Synchronization of image data from Kmart's database to Anko's database
  ImageSyncData:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-image-sync-data'
      Description: Image synchronization from Kmart's internal MS SQL database to Anko's MySQL database
      CodeUri: ../src/image-sync-data/
      Handler: image-sync-data.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-image-sync-data'
            Description: Runs once every day 20 minutes after midnight, Sydney, Australia time
            Schedule: cron(20 14 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Scans Anko's database and determines which images to retrieve from Kmart, uploading those to Anko's S3 Bucket
  ImageSyncS3:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-image-sync-s3'
      Description: Image synchronization from Kmart's internal MS SQL database to Anko's MySQL database
      CodeUri: ../src/image-sync-s3/
      Handler: image-sync-s3.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        CloudWatchEvent:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-image-sync-s3'
            Description: Runs once every day 40 minutes after midnight, Sydney, Australia time
            Schedule: cron(40 14 * * ? *)
            Enabled: true
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # System Inventory Checks
  SystemInventoryChecks:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-system-inventory-checks'
      Description: Create system inventory check tasks
      CodeUri: ../src/system-inventory-checks/
      Handler: system-inventory-checks.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        SystemInventoryChecks:
          Type: Api
          Properties:
            Path: /system-inventory-checks
            Method: post
            RestApiId:
              Ref: RestApiGateway
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # Kmart Inventory Snapshot
  KmartInventorySnapshot:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-kmart-inventory-snapshot'
      Description: Create Kmart Inventory Snapshot at the start of backfill schedules
      CodeUri: ../src/kmart-inventory-snapshot/
      Handler: kmart-inventory-snapshot.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Events:
        KmartInventorySnapshot:
          Type: Schedule
          Properties:
            Name: !Sub '${ClientName}-${EnvironmentType}-kmart-inventory-snapshot'
            Schedule: cron(3,18,33,48 * * * ? *) # Once every 15 minutes, offset 3 minutes
            Enabled: false
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt BasicExecutionAndSecretsIAMRole.Arn

  # BackfillEfficacyReport Lambda Function
  BackfillEfficacyReport:
    Type: AWS::Serverless::Function
    DependsOn:
      - BasicExecutionAndSecretsIAMRole
    Properties:
      Description: Generates backfill efficacy report once per day
      CodeUri: ../../../shared/src/generate-backfill-efficacy-report/
      Handler: generate-backfill-efficacy-report.handler
      Runtime: nodejs12.x
      Layers:
