              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: !Sub '${ClientName}-${EnvironmentType}-FetchAndCompareImagesPIMSIAMRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*"
      Description: Role to process keycode from queue and fetch images from PIMS DB
      RoleName: !Sub '${ClientName}-${EnvironmentType}-FetchAndCompareImagesPIMSIAMRole' 
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
  #FetchAndCompareImagesPIMSLambda
  FetchAndCompareImagesPIMSLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - FetchAndCompareImagesPIMSIAMRole
    Properties:
      Description: Get Keycodes from Queue, fetch the ImageHash from PIM_DB and check if image changed, then push to next queue
      CodeUri: ../../../shared/src/product-and-image-sync/fetch-and-compare-images-pims/
      Handler: index.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: 5
      FunctionName: !Sub '${ClientName}-${EnvironmentType}-fetch-and-compare-images-pims'
      Role: !GetAtt FetchAndCompareImagesPIMSIAMRole.Arn
  #FetchAndCompareImagesPIMSSQSEvent
  FetchAndCompareImagesPIMSSQSEvent:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn:
        Fn::GetAtt:
          - FetchAndCompareImagesPIMSQueue
          - Arn  
      FunctionName:
        Ref: FetchAndCompareImagesPIMSLambda
  #UploadImagesToS3Queue
  UploadImagesToS3Queue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 5
      QueueName: !Sub '${ClientName}-${EnvironmentType}-upload-images-to-s3-queue'
      ReceiveMessageWaitTimeSeconds: 1
      VisibilityTimeout: 301
      MessageRetentionPeriod: 905
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt 'ProductSyncDeadLetterQueue.Arn'
        maxReceiveCount: 3
  #UploadImagesToS3IAMRole
  UploadImagesToS3IAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: !Sub '${ClientName}-${EnvironmentType}-UploadImagesToS3IAMRolePolicy'
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'secretsmanager:GetSecretValue'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: "*"
      Description: Role to upload product images to our s3 bucket
      RoleName:  !Sub '${ClientName}-${EnvironmentType}-UploadImagesToS3IAMRole' 
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
  #UploadImagesToS3Lambda
  UploadImagesToS3Lambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - UploadImagesToS3IAMRole
    Properties:
      Description: Process Products Data that are being put on the SQS
      CodeUri: ../../../shared/src/product-and-image-sync/upload-images-to-s3/
      Handler: index.handler
      Runtime: nodejs12.x
      Layers:
        - !Ref GetConfigLayer
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: 20
      FunctionName:  !Sub '${ClientName}-${EnvironmentType}-upload-images-to-s3'
      Role: !GetAtt UploadImagesToS3IAMRole.Arn 
  #UploadImagesToS3LambdaSQSEvent
  UploadImagesToS3LambdaSQSEvent:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn:
        Fn::GetAtt:
          - UploadImagesToS3Queue
          - Arn  
      FunctionName:
        Ref: UploadImagesToS3Lambda
  ProductSyncDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ClientName}-${EnvironmentType}-product-sync-dead-letter-queue' 
  # =============================== Product & Image Sync Infra (end) ===============================
